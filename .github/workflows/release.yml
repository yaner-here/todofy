name: Release

# Publishes a release when a version bump lands on main. The version is read
# from package.json; a published release is never rebuilt, while a failed
# draft can be resumed after a workflow fix. Release notes are pulled from
# the matching section of CHANGELOG.md.
#
# Builds run on Linux, macOS (universal: Intel + Apple Silicon in one .dmg),
# and Windows, each uploading its bundle to the same draft release. The
# release is only flipped to published once every platform has succeeded —
# if one leg fails, the others' assets still land on the draft so it can be
# inspected and published by hand.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect version and whether it needs releasing
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if RELEASE_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$RELEASE_DRAFT" = "true" ]; then
              echo "Release v$VERSION is still a draft — resuming its build."
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$VERSION is already published — nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "v$VERSION is new — will build and publish."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate version and official release configuration
        shell: bash
        run: |
          for NAME in \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [ -z "${!NAME}" ]; then
              echo "::error::$NAME is required for an official release."
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('node:fs');
          const packageVersion = require('./package.json').version;
          const tauriConfig = require('./src-tauri/tauri.conf.json');
          const tauriVersion = tauriConfig.version;
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version = "([^"]+)"/m)?.[1];
          if (!packageVersion || packageVersion !== tauriVersion || packageVersion !== cargoVersion) {
            throw new Error(`Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}`);
          }
          const changelog = fs.readFileSync('./CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## v${packageVersion} `)) {
            throw new Error(`CHANGELOG.md has no v${packageVersion} section`);
          }
          // An unsigned or unannounced release can never be updated into, and
          // the mistake only shows up once users are already stranded on it.
          if (tauriConfig.bundle?.createUpdaterArtifacts !== true) {
            throw new Error('bundle.createUpdaterArtifacts must be true to ship updates');
          }
          const updater = tauriConfig.plugins?.updater ?? {};
          if (!updater.pubkey) {
            throw new Error('plugins.updater.pubkey is missing');
          }
          const updaterPublicKey = Buffer.from(updater.pubkey, 'base64').toString('utf8').match(/^RW\S+/m)?.[0];
          if (!updaterPublicKey) {
            throw new Error('plugins.updater.pubkey is invalid');
          }
          if (!updater.endpoints?.some((url) => url.startsWith('https://'))) {
            throw new Error('plugins.updater.endpoints must hold an HTTPS endpoint');
          }
          NODE

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*microsoft*.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit production frontend dependencies
        run: bun audit --production

      - name: Build frontend
        run: bun run build

      - name: Test frontend
        run: bun run test

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  release:
    needs: [check, validate]
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NOTES=$(awk -v v="## v$VERSION" '
            index($0, v) == 1 { grab = 1; next }
            /^## v/ && grab { exit }
            grab { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Download a bundle below for your platform."
          fi
          {
            echo 'RELEASE_NOTES<<CHANGELOG_EOF'
            printf '%s\n' "$NOTES"
            echo ''
            echo '---'
            echo 'Download a bundle below for your platform (.deb/.rpm/.AppImage for Linux, .dmg for macOS, .msi/.exe for Windows).'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Everything below comes from the Ubuntu archive, but apt-get update
          # exits non-zero if *any* configured source fails. The runner image
          # ships Google and Microsoft repos whose CDNs intermittently serve an
          # index that doesn't match their Release file ("Hash Sum mismatch"),
          # which would fail the release for reasons unrelated to it.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*microsoft*.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds need both Apple Silicon and Intel targets;
          # Linux/Windows just use the runner's default host target.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The bundler chmods every tool it downloads to 0770 and then copies
      # AppRun straight into the AppDir, so the launcher ends up runnable by
      # nobody but its owner. Nothing goes wrong when the runtime mounts the
      # image for the user who started it, but a sandbox that mounts it as root
      # — firejail --appimage, and the AppImage catalog's test — cannot exec it.
      # The bundler only downloads what is missing, so seed the cache instead.
      # Remove once tauri-apps/tauri#16155 ships.
      - name: Seed the AppImage launcher with world-readable permissions
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          ARCH="$(uname -m)"
          mkdir -p "$TOOLS"
          curl --fail --show-error --silent --location --retry 3 \
            -o "$TOOLS/AppRun-$ARCH" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-$ARCH"
          chmod 755 "$TOOLS/AppRun-$ARCH"

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without it the build fails, which is
          # what we want: an unsigned release can never be updated into.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: "todofy v${{ needs.check.outputs.version }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # The manifest is composed once, after every platform has uploaded —
          # three parallel jobs each merging their own copy would race.
          includeUpdaterJson: false

      # Check the permissions stored in SquashFS. Newer AppImage runtimes
      # create --appimage-extract directories as 0700 without restoring their
      # archived modes, so inspecting that output falsely rejects valid images.
      # unsquashfs restores the stored modes, including genuinely restricted
      # directories. The uploaded release stays a draft until this check passes.
      - name: Reject owner-only files inside the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE="$(ls -1 src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
          APPIMAGE="$(readlink -f "$APPIMAGE")"
          chmod +x "$APPIMAGE"
          OFFSET="$("$APPIMAGE" --appimage-offset)"
          if [[ ! "$OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid SquashFS offset in $(basename "$APPIMAGE")"
            exit 1
          fi
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          unsquashfs -no-progress -o "$OFFSET" \
            -d "$WORKDIR/squashfs-root" "$APPIMAGE" >/dev/null
          cd "$WORKDIR"
          # Require other-user read access, directory traversal, and execution
          # for any executable file. Data files do not need an executable bit.
          OWNER_ONLY="$(find squashfs-root \( -type f -o -type d \) \
            \( ! -perm -004 \
              -o \( -type d ! -perm -001 \) \
              -o \( -type f -perm /111 ! -perm -001 \) \) \
            -printf '%M %p\n')"
          if [ -n "$OWNER_ONLY" ]; then
            echo "::error::$(basename "$APPIMAGE") holds files no other user can read or run:"
            printf '%s\n' "$OWNER_ONLY"
            exit 1
          fi
          echo "All files in $(basename "$APPIMAGE") are readable; directories and executables are accessible to any user."

  # Writes the latest.json the in-app updater polls. It must land before the
  # release leaves draft, or the first person to check would be told there is
  # no update.
  manifest:
    needs: [check, validate, release]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Compose the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          mkdir -p signatures
          gh release download "$TAG" --repo "$REPO" --dir signatures --pattern '*.sig'

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name]')

          ASSETS="$ASSETS" TAG="$TAG" node <<'NODE'
          const fs = require('node:fs');
          const { VERSION, REPO, TAG } = process.env;
          const names = JSON.parse(process.env.ASSETS);

          const url = (name) =>
            `https://github.com/${REPO}/releases/download/${TAG}/${encodeURIComponent(name)}`;
          const signature = (name) =>
            fs.readFileSync(`signatures/${name}.sig`, 'utf8').trim();

          // A universal macOS build serves both architectures from one archive.
          const bundles = names.filter((name) => !name.endsWith('.sig'));
          const wanted = {
            'linux-x86_64': bundles.find((n) => n.endsWith('.AppImage')),
            'darwin-x86_64': bundles.find((n) => n.endsWith('.app.tar.gz')),
            'darwin-aarch64': bundles.find((n) => n.endsWith('.app.tar.gz')),
            'windows-x86_64':
              bundles.find((n) => n.endsWith('-setup.exe')) ??
              bundles.find((n) => n.endsWith('.msi')),
          };

          const missing = Object.entries(wanted).filter(([, name]) => !name);
          if (missing.length) {
            throw new Error(
              `No updater artifact for: ${missing.map(([key]) => key).join(', ')}`,
            );
          }

          const platforms = {};
          for (const [key, name] of Object.entries(wanted)) {
            platforms[key] = { signature: signature(name), url: url(name) };
          }

          fs.writeFileSync(
            'latest.json',
            JSON.stringify(
              {
                version: VERSION,
                // Deliberately a pointer rather than the changelog section:
                // every client fetches this file, and the app links out to
                // the release page for the details.
                notes: `todofy v${VERSION} — https://github.com/${REPO}/releases/tag/${TAG}`,
                pub_date: new Date().toISOString(),
                platforms,
              },
              null,
              2,
            ),
          );
          console.log(`latest.json for v${VERSION}:`);
          console.log(Object.keys(platforms).join(', '));
          NODE

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

  publish:
    needs: [check, validate, release, manifest]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.check.outputs.version }}" --draft=false --repo "${{ github.repository }}"
